name: PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript type-check
        # `npm run typecheck`, not a bare `tsc --noEmit`. tsconfig.json is a
        # solution file ("files": [] plus references), and TypeScript only
        # follows references under --build - so `tsc --noEmit` compiled zero
        # files here and this job was green by construction. The script runs
        # each referenced project explicitly. Pinned by
        # tests/ci-typecheck-gate.test.ts.
        run: npm run typecheck

  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lockfile matches package.json (npm 10)
        # Node 20 ships npm 10, the release whose arborist crashed re-resolving
        # this tree (see tests/npm-lockfile-resolution.test.ts). Rewriting the
        # lockfile in place must succeed and change nothing: a stale lockfile
        # or a crash fails here instead of on a contributor's machine.
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code package-lock.json

      - name: Fresh resolution succeeds (npm 10)
        # The crash only showed on a full re-resolution, which an in-sync
        # lockfile skips: resolve package.json from scratch as well.
        run: |
          mkdir -p "$RUNNER_TEMP/fresh"
          cp package.json "$RUNNER_TEMP/fresh/"
          cd "$RUNNER_TEMP/fresh"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

  audit-prod:
    name: Dependency Audit (shipped)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Audit production (shipped) dependencies
        # Gates only the bundled app tree. Dev/build-time advisories are tracked,
        # documented exceptions in docs/dependency-security.md. A new advisory on
        # a shipped package fails this job and blocks the PR.
        run: npm run audit:prod

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Vitest (unit + component + integration)
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: test-results/junit.xml
          retention-days: 14

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        # requirements.txt keeps the heavy CUDA stack (torch/diffusers) commented
        # out, so this installs only the lightweight server + test deps the unit
        # tests need (fastapi, pydantic, Pillow, numpy, pytest, ...). The services
        # import torch lazily inside try-blocks and run in stub mode without it.
        run: pip install -r backend/requirements.txt

      - name: Run backend tests (pytest)
        # pytest is a superset of the unittest suites and also collects the
        # pytest-style tests (fixtures/monkeypatch) that `unittest discover`
        # silently skipped. Config (testpaths, pythonpath, benchmark ignore)
        # lives in backend/pytest.ini. Runs the unit + integration tiers
        # (benchmarks are excluded by pytest.ini addopts).
        working-directory: backend
        run: python -m pytest -v --junitxml=test-results/backend-junit.xml

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/backend-junit.xml
          retention-days: 14
