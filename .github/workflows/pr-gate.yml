name: PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job in this gate writes to the repository.
permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: TypeScript type-check
        # `npm run typecheck`, not a bare `tsc --noEmit`. tsconfig.json is a
        # solution file ("files": [] plus references), and TypeScript only
        # follows references under --build - so `tsc --noEmit` compiled zero
        # files here and this job was green by construction. The script runs
        # each referenced project explicitly. Pinned by
        # tests/ci-typecheck-gate.test.ts.
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint (zero warnings)
        run: npm run lint

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vite build (renderer + main + preload)
        run: npm run build

  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Lockfile matches package.json (npm 10)
        # Node 22 (.nvmrc) ships npm 10, the release whose arborist crashed
        # re-resolving this tree (see tests/npm-lockfile-resolution.test.ts). Rewriting the
        # lockfile in place must succeed and change nothing: a stale lockfile
        # or a crash fails here instead of on a contributor's machine.
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code package-lock.json

      - name: Fresh resolution succeeds (npm 10)
        # The crash only showed on a full re-resolution, which an in-sync
        # lockfile skips: resolve package.json from scratch as well.
        run: |
          mkdir -p "$RUNNER_TEMP/fresh"
          cp package.json "$RUNNER_TEMP/fresh/"
          cd "$RUNNER_TEMP/fresh"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

  audit-prod:
    name: Dependency Audit (shipped)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit production (shipped) dependencies
        # Gates only the bundled app tree. Dev/build-time advisories are tracked,
        # documented exceptions in docs/dependency-security.md. A new advisory on
        # a shipped package fails this job and blocks the PR.
        run: npm run audit:prod

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run Vitest (unit + component + integration)
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-results
          path: test-results/junit.xml
          retention-days: 14

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev-linux.txt

      - name: Install backend test dependencies
        # Hash-locked server + test deps (backend/requirements/dev-linux.txt,
        # generated by uv pip compile --generate-hashes). The heavy CUDA stack
        # is locked separately for release builds; the services import torch
        # lazily inside try-blocks and run in stub mode without it.
        run: pip install --require-hashes -r backend/requirements/dev-linux.txt

      - name: Audit locked backend runtime dependencies
        # Fails the gate on any known vulnerability in the shipped Python
        # runtime lock (the same audit the lock was generated against).
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit -r backend/requirements/runtime-linux.txt --no-deps --disable-pip

      - name: Run backend tests (pytest)
        # pytest is a superset of the unittest suites and also collects the
        # pytest-style tests (fixtures/monkeypatch) that `unittest discover`
        # silently skipped. Config (testpaths, pythonpath, benchmark ignore)
        # lives in backend/pytest.ini. Runs the unit + integration tiers
        # (benchmarks are excluded by pytest.ini addopts).
        working-directory: backend
        run: python -m pytest -v --junitxml=test-results/backend-junit.xml

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: backend/test-results/backend-junit.xml
          retention-days: 14
