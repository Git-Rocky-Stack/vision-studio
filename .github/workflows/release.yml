name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: "Skip E2E tests"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; only publish-release elevates to contents: write.
permissions:
  contents: read

jobs:
  test-full:
    name: Full Test Suite
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev-windows.txt

      - run: npm ci

      - name: Install backend test dependencies
        run: pip install --require-hashes -r backend/requirements/dev-windows.txt

      - name: TypeScript type-check
        # See the note in pr-gate.yml: a bare `tsc --noEmit` against the
        # solution tsconfig checks nothing. Pinned by
        # tests/ci-typecheck-gate.test.ts.
        run: npm run typecheck

      - name: Frontend tests (unit + component + integration)
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Backend tests (pytest)
        # See backend/pytest.ini. pytest runs both the unittest.TestCase suites
        # and the pytest-style tests; benchmarks are excluded by default.
        working-directory: backend
        run: python -m pytest -v

      - name: Build app
        # VITE_E2E_STORE exposes the Zustand store on window for the Electron
        # E2E specs that seed state; production builds never set it.
        run: npm run build
        env:
          VITE_E2E_STORE: "1"

      - name: Install Playwright browsers
        if: ${{ !inputs.skip_e2e }}
        run: npx playwright install chromium

      - name: Set runner display to 1920x1080
        # The stock runner display is 1024x768, which clamps the 1600x1000 E2E
        # window to its 1200x800 minimum and fails every Windows visual
        # baseline on size alone. Fails fast if the resolution does not take.
        if: ${{ !inputs.skip_e2e }}
        shell: pwsh
        run: ./scripts/ci-set-display-resolution.ps1 -Width 1920 -Height 1080 -MinWidth 1600 -MinHeight 1000

      - name: E2E tests
        if: ${{ !inputs.skip_e2e }}
        run: npx playwright test --reporter=list,junit --output=test-results/e2e
        env:
          VISION_STUDIO_SKIP_BACKEND: "1"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  build-windows:
    name: Build Windows
    needs: test-full
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # `secrets` is not readable from step-level `if`; surface presence here.
      R2_SECRETS_PRESENT: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Build backend bundle (torch + diffusers stack + PyInstaller)
        # Without this the electron-builder beforePack gate
        # (scripts/assert-native-backend.cjs) throws on every run: the
        # Windows installer ships the native backend, so it must be built on
        # this runner exactly as release-mac-linux.yml does for mac/linux.
        run: npm run build:backend

      - name: Prune backend build intermediates
        shell: bash
        run: rm -rf backend/venv backend/build

      - name: Fetch preview decoders (taesd family)
        run: node scripts/fetch-preview-decoders.cjs

      - name: Build frontend
        run: npm run build

      - name: Verify release signing credentials
        run: npm run release:signing:check
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_SUBJECT_NAME: ${{ secrets.WIN_CSC_SUBJECT_NAME }}
          WIN_CSC_SHA1: ${{ secrets.WIN_CSC_SHA1 }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_CERTIFICATE_PATH: ${{ secrets.AZURE_CLIENT_CERTIFICATE_PATH }}
          AZURE_USERNAME: ${{ secrets.AZURE_USERNAME }}
          AZURE_PASSWORD: ${{ secrets.AZURE_PASSWORD }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}

      - name: Package signed Windows release
        run: npm run package:win:signed
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_SUBJECT_NAME: ${{ secrets.WIN_CSC_SUBJECT_NAME }}
          WIN_CSC_SHA1: ${{ secrets.WIN_CSC_SHA1 }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_CERTIFICATE_PATH: ${{ secrets.AZURE_CLIENT_CERTIFICATE_PATH }}
          AZURE_USERNAME: ${{ secrets.AZURE_USERNAME }}
          AZURE_PASSWORD: ${{ secrets.AZURE_PASSWORD }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}

      - name: Upload release artifact
        # nsis-web writes the stub + .nsis.7z + latest.yml into
        # release/nsis-web/. Only the small files ride GitHub artifacts; the
        # multi-GB zip and .nsis.7z are delivered from R2.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vision-studio-windows-x64
          path: |
            release/nsis-web/*.exe
            release/nsis-web/latest*.yml
            release/latest*.yml
            release/*.blockmap
          retention-days: 90

      # #34 installer PR4: publish the update feed + installer to Cloudflare R2
      # (GitHub caps release assets at 2 GB - the heavy installer lives on R2).
      # Runs only on version tags AND only once the R2 secrets exist; binaries
      # upload first and latest.yml last (see scripts/publish-r2.cjs), so a
      # failed publish never flips clients to a missing installer.
      - name: Publish update feed to R2
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.R2_SECRETS_PRESENT == 'true' }}
        # Two invocations by design (docs/R2-DELIVERY.md section 3): the
        # portable zip lives in release/, the nsis-web stub + .nsis.7z +
        # latest.yml in release/nsis-web/ - and the feed still uploads
        # absolutely last, on the second call.
        run: npm run release:publish:r2 && npm run release:publish:r2 -- --dir release/nsis-web
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

  # macOS + Linux builds live in release-mac-linux.yml: they need the full
  # native backend build (PyInstaller cannot cross-compile), which the old
  # frontend-only linux job here never did - it died at the heavy-by-design
  # beforePack gate every time.

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Require curated release notes
        # Each tag ships with hand-written notes in docs/release-notes/<tag>.md
        # (upgrade requirements, security changes, install and signing state).
        # Fail before publishing rather than ship a release with only the
        # auto-generated PR list.
        shell: bash
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error file=$notes::Missing release notes for ${GITHUB_REF_NAME}. Add $notes before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        # Notes + small metadata only. GitHub caps assets at 2 GB; every
        # multi-GB installer (win/mac/linux) is delivered from R2 behind
        # updates.vision-studio-x.com - see docs/R2-DELIVERY.md.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Curated notes first; the auto-generated PR list is appended below.
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            artifacts/vision-studio-windows-x64/**/*.exe
            artifacts/vision-studio-windows-x64/**/*.yml
            artifacts/vision-studio-windows-x64/**/*.blockmap
