<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Relative, not root-absolute: the packaged renderer loads from file://,
         where "/favicon.png" would resolve to the filesystem root. -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Keep this CSP in sync with electron/services/contentSecurityPolicy.ts
      (META_CONTENT_SECURITY_POLICY). The browser enforces the INTERSECTION of this
      meta policy and the Electron session-header policy, and the packaged file://
      page gets no response headers at all, so this tag is the production policy.
      No inline scripts are allowed: the only hash is the Vite dev server's React
      Refresh preamble. The meta-matches-header consistency is locked by
      contentSecurityPolicy.test.ts.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: file: http://127.0.0.1:8000 http://localhost:8000; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 ws://127.0.0.1:8000 ws://localhost:8000; media-src 'self' blob: file: http://127.0.0.1:8000 http://localhost:8000; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Vision Studio - AI Image & Video Generation</title>
    <meta name="description" content="Professional AI-powered image and video generation for content creators" />

    <!-- Fonts are bundled locally via @fontsource (src/fonts.ts), never a runtime
         CDN: Vision Studio is local-first/offline-capable and must not phone home to
         Google Fonts on launch. See DESIGN.md, Typography section. -->

    <!-- Prevent FOUC: these two values are --color-void in each theme (src/index.css) -->
    <style>
      :root { --fouc-bg: #000000; }
      :root[data-theme='light'] { --fouc-bg: #f4f4f4; }
      html, body, #root {
        margin: 0;
        padding: 0;
        background-color: var(--fouc-bg);
      }
    </style>
    <!-- Applies the persisted theme before first paint (public/theme-init.js). -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
